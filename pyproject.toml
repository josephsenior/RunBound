[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "runbound"
version = "0.1.0"
description = "Run subprocesses with bounded output, deadlines, and process-tree cleanup"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Youssef Mejdi" }]
keywords = ["subprocess", "process", "timeout", "automation", "agents", "ci"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: System :: Systems Administration",
  "Topic :: Utilities",
]

[project.scripts]
runbound = "runbound.cli:main"

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "ruff>=0.11",
]

[project.urls]
Homepage = "https://github.com/josephsenior/RunBound"
Repository = "https://github.com/josephsenior/RunBound"
Issues = "https://github.com/josephsenior/RunBound/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/runbound"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/README.md",
  "/LICENSE",
  "/SECURITY.md",
  "/CHANGELOG.md",
  "/GRINTA_INTEGRATION.md",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
